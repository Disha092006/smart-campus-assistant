name: Build Smart Campus Assistant
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build fat JAR
        run: mvn -B package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: smart-campus-assistant
          path: target/smart-campus-assistant-1.0.0.jar